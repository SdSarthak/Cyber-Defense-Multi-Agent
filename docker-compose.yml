version: "3.9"

# Containers reach each other by service name. .env (copied from .env.example) points
# at localhost for running the API directly on the host, so every in-network service
# overrides the hosts here; without this the API and simulator containers tried to
# reach PostgreSQL, Redis, Elasticsearch and ChromaDB on their own loopback.
x-service-hosts: &service-hosts
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  CHROMA_HOST: chromadb
  CHROMA_PORT: "8000"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cd_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberdefense}
      POSTGRES_USER: ${POSTGRES_USER:-cyberdefense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberdefense}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cd_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch ─────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cd_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── ChromaDB ──────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.15
    container_name: cd_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ── API (FastAPI) ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: cd_api
    env_file: .env
    environment: *service-hosts
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - .:/app
    # Migrations run on startup (RUN_MIGRATIONS_ON_STARTUP); --reload is for the
    # bind-mounted dev source. Drop both the mount and --reload for production.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Dashboard (React) ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
      # Inlined into the bundle at build time — the browser, not the container,
      # calls the API, so these are host-facing URLs.
      args:
        REACT_APP_API_URL: http://localhost:8000
        REACT_APP_WS_URL: ws://localhost:8000
    container_name: cd_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Simulation Engine ─────────────────────────────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: cd_simulator
    env_file: .env
    environment: *service-hosts
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: python -m simulation.engine
    volumes:
      - .:/app

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cd_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: cd_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources

volumes:
  postgres_data:
  redis_data:
  es_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: cyberdefense_net
