global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cyberdefense_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

# Redis and PostgreSQL do not speak the Prometheus exposition format, so scraping
# redis:6379 / postgres:5432 directly only produced permanently-down targets. To
# monitor them, run oliver006/redis_exporter and prometheuscommunity/postgres-exporter
# and add their :9121 / :9187 endpoints here.
